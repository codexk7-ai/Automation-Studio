# Advances schedules, delays, retries and approval timeouts on the Vercel
# deployment. Vercel Hobby crons run only once a day, so this calls the same
# secured endpoint every 5 minutes. GitHub may delay scheduled runs at busy times.
#
# Repository secrets: APP_URL (e.g. https://your-app.vercel.app) and CRON_SECRET
# (the same value as the Vercel environment variable).
name: Queue tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/internal/tick
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET secret is not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/internal/tick"
