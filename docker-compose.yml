# Production-like local stack: PostgreSQL + API + separate worker (+ optional Ollama).
# Usage: set ENCRYPTION_KEY and POSTGRES_PASSWORD in .env, then `docker compose up -d --build`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: automation
      POSTGRES_USER: automation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automation -d automation"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://automation:${POSTGRES_PASSWORD}@postgres:5432/automation
      WORKER_MODE: "off"
      HOST: 0.0.0.0
      OUTBOUND_ALLOWLIST: ollama:11434
    ports:
      - "8787:8787"

  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://automation:${POSTGRES_PASSWORD}@postgres:5432/automation
      OUTBOUND_ALLOWLIST: ollama:11434
    command: ["node", "dist/worker.js"]
    deploy:
      replicas: 1

  # Optional local model runtime: `docker compose --profile ai up -d`, then `docker compose exec ollama ollama pull llama3.2`
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
